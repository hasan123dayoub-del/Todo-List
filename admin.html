<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Page</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a href="index.html" class="btn btn-outline-light border-0">
          <i class="bi bi-arrow-right fs-4"></i>
        </a>
        <a class="navbar-brand fw-bold" href="#">
          <i class="bi bi-person-badge"></i> الملف الشخصي
        </a>
        <div></div>
      </div>
    </nav>

    <div class="container my-5">
      <div
        class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
      >
        <div>
          <h2 class="fw-bold mb-1">المهام</h2>
          <p class="text-muted mb-0">إدارة ومتابعة جميع المهام والمستخدمين</p>
        </div>
        <span class="badge bg-success fs-6 px-3 py-2" id="taskCount">
          <i class="bi bi-list-check"></i> إجمالي المهام: 0
        </span>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div
            class="stat-card bg-white p-3 rounded shadow-sm border-start border-4 border-success"
          >
            <div class="d-flex justify-content-between">
              <div>
                <p class="text-muted mb-1">مكتملة</p>
                <h3 class="fw-bold mb-0" id="completedCount">0</h3>
              </div>
              <i class="bi bi-check-circle-fill text-success fs-1"></i>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div
            class="stat-card bg-white p-3 rounded shadow-sm border-start border-4 border-warning"
          >
            <div class="d-flex justify-content-between">
              <div>
                <p class="text-muted mb-1">قيد التنفيذ</p>
                <h3 class="fw-bold mb-0" id="progressCount">0</h3>
              </div>
              <i class="bi bi-hourglass-split text-warning fs-1"></i>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div
            class="stat-card bg-white p-3 rounded shadow-sm border-start border-4 border-danger"
          >
            <div class="d-flex justify-content-between">
              <div>
                <p class="text-muted mb-1">لم تبدأ</p>
                <h3 class="fw-bold mb-0" id="pendingCount">0</h3>
              </div>
              <i class="bi bi-clock-fill text-danger fs-1"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0">
            <i class="bi bi-table text-primary"></i> جدول المهام
          </h5>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th># Task ID</th>
                  <th>Task Name</th>
                  <th>User Name</th>
                  <th>Task Status</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody id="tasksTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="d-flex gap-3 mt-4 flex-wrap">
        <button class="btn btn-primary btn-lg px-4" onclick="addNewUser()">
          <i class="bi bi-person-plus-fill"></i> إضافة مستخدم جديد
        </button>
        <button class="btn btn-success btn-lg px-4" onclick="addNewTask()">
          <i class="bi bi-plus-circle-fill"></i> إضافة مهمة جديدة
        </button>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="JS/script.js"></script>
  </body>
</html>
