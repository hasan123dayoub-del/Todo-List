<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks Management</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold"
          ><i class="bi bi-list-check"></i> إدارة المهام</span
        >
        <a href="index.html" class="btn btn-outline-light border-0"
          ><i class="bi bi-arrow-left fs-4"></i
        ></a>
      </div>
    </nav>

    <div class="container my-5">
      <div
        class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
      >
        <div>
          <h2 class="fw-bold mb-1">لوحة المهام</h2>
          <p class="text-muted mb-0">متابعة حالات المهام وتوزيعها</p>
        </div>
      </div>

      <div class="d-flex gap-3 mb-4 flex-wrap">
        <button
          class="btn btn-success btn-lg px-4"
          data-bs-toggle="modal"
          data-bs-target="#addTaskModal"
          onclick="loadUsersForTask()"
        >
          <i class="bi bi-plus-circle-fill"></i> إضافة مهمة جديدة
        </button>
        <button
          class="btn btn-danger btn-lg px-4"
          data-bs-toggle="modal"
          data-bs-target="#deleteTaskModal"
          onclick="loadTasksForAction('delete')"
        >
          <i class="bi bi-trash-fill"></i> حذف مهمة
        </button>
        <button
          class="btn btn-warning btn-lg px-4 text-dark"
          data-bs-toggle="modal"
          data-bs-target="#editTaskModal"
          onclick="loadTasksForAction('edit')"
        >
          <i class="bi bi-pencil-fill"></i> تعديل حالة مهمة
        </button>
      </div>

      <div
        class="card shadow-sm border-0 mb-4 border-start border-4 border-danger"
      >
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 text-danger">
            <i class="bi bi-clock-fill"></i> لم تبدأ
          </h5>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>اسم المهمة</th>
                <th>المستلم</th>
              </tr>
            </thead>
            <tbody id="pendingBody"></tbody>
          </table>
        </div>
      </div>

      <div
        class="card shadow-sm border-0 mb-4 border-start border-4 border-warning"
      >
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 text-warning">
            <i class="bi bi-hourglass-split"></i> قيد التنفيذ
          </h5>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>اسم المهمة</th>
                <th>المستلم</th>
              </tr>
            </thead>
            <tbody id="progressBody"></tbody>
          </table>
        </div>
      </div>

      <div
        class="card shadow-sm border-0 mb-4 border-start border-4 border-success"
      >
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 text-success">
            <i class="bi bi-check-circle-fill"></i> مكتملة
          </h5>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>اسم المهمة</th>
                <th>المستلم</th>
              </tr>
            </thead>
            <tbody id="completedBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">إضافة مهمة جديدة</h5>
          </div>
          <form id="addTaskForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label fw-bold">اختر المستخدم</label>
                <select class="form-select" id="taskUserSelect" required>
                  <option value="">جاري التحميل...</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">اسم المهمة</label>
                <input
                  type="text"
                  class="form-control"
                  id="taskNameInput"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">حالة المهمة</label>
                <select class="form-select" id="taskStatusSelect" required>
                  <option value="pending">لم تبدأ</option>
                  <option value="in-progress">قيد التنفيذ</option>
                  <option value="completed">مكتملة</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                إلغاء
              </button>
              <button type="submit" class="btn btn-warning text-dark">
                إضافة المهمة
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="deleteTaskModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">حذف مهمة نهائياً</h5>
          </div>
          <form id="deleteTaskForm">
            <div class="modal-body">
              <label class="form-label fw-bold"
                >اختر المهمة التي تريد حذفها:</label
              >
              <select class="form-select" id="deleteTaskSelect" required>
                <option value="">جاري تحميل المهام...</option>
              </select>
              <div class="form-text text-danger mt-2">
                تحذير: سيتم حذف المهمة بالكامل وإلغاء ربطها بالمستخدم.
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                إلغاء
              </button>
              <button type="submit" class="btn btn-danger">حذف نهائي</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title">تعديل حالة مهمة</h5>
          </div>
          <form id="editTaskForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label fw-bold">اختر المهمة</label>
                <select class="form-select" id="editTaskSelect" required>
                  <option value="">جاري تحميل المهام...</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">الحالة الجديدة</label>
                <select class="form-select" id="newTaskStatus" required>
                  <option value="pending">لم تبدأ</option>
                  <option value="in-progress">قيد التنفيذ</option>
                  <option value="completed">مكتملة</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                إلغاء
              </button>
              <button type="submit" class="btn btn-warning text-dark">
                حفظ التعديل
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Client/common.js"></script>
    <script src="Client/tasks.js"></script>
  </body>
</html>
